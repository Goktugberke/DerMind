# Test profile — H2 + Flyway disabled + no Firebase
spring.datasource.url=jdbc:h2:mem:dermindtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled in tests (H2 + create-drop yeterli)
spring.flyway.enabled=false

# Cache disabled
spring.cache.type=none

# Docker Compose disabled
spring.docker.compose.enabled=false

# AI server — tests mock'lar
ai.server.url=http://localhost:8000
ai.server.internal-key=

# Rate limiting
ratelimit.product-detail.requests-per-minute=1000

# Tracing kapalı
management.otlp.tracing.endpoint=
management.tracing.sampling.probability=0.0
