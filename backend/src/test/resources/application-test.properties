# H2 in-memory DB — no real PostgreSQL needed for tests
spring.datasource.url=jdbc:h2:mem:dermindtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Docker Compose integration in tests
spring.docker.compose.enabled=false

# Fake Google OAuth2 credentials so context loads without real credentials
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# AI server URL — mocked in tests, doesn't need to be real
ai.server.url=http://localhost:8000
