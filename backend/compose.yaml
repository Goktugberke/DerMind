services:
  postgres:
    image: postgres:15
    container_name: dermind-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dermind
    ports:
      - "5438:5432"
    volumes:
      - dermindpgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      retries: 5

  ai-server:
    build:
      context: ../ai-server
      dockerfile: Dockerfile
    image: dermind-ai
    container_name: dermind-ai
    restart: on-failure
    env_file:
      - ../ai-server/.env
    environment:
      ALLOWED_ORIGINS: "http://localhost:8080,http://dermind-backend:8080"
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    image: dermind
    container_name: dermind-backend
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dermind
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AI_SERVER_URL: http://ai-server:8000
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    profiles: ["production"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: dermind-frontend
    container_name: dermind-frontend
    ports:
      - "80:80"

volumes:
  dermindpgdata: {}
